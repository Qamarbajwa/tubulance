# MATHEMATICAL_REGRESSION_RULES.yaml — Mathematical Regression Rules
# Invariants and automated regression constraints generated from proof incidents.

rules:
  - rule_id: "MRR-001"
    name: "CONVENTION_M_INDEX_ORDER"
    statement: "All spatial Jacobian matrices must obey [J_f]_{ij} = partial_j f_i. Velocity gradient A = J_u (A_{ij} = partial_j u_i), vorticity gradient G = J_omega (G_{ij} = partial_j omega_i). In spatial derivatives of material derivatives: d_j(D_t omega_i) = D_t G_{ij} + [G A]_{ij}."
    incident_id: "INC-001"
    enforcement_test: "tests/test_tp2_g4_a2_suite.py::test_g_tensor_equation_components"

  - rule_id: "MRR-002"
    name: "PARABOLIC_SCALING_HOMOGENEITY"
    statement: "Every comparative inequality or rate involving Navier-Stokes observables must be dimensionally homogeneous under the parabolic scaling x -> lambda x, t -> lambda^2 t, u -> lambda u, omega -> lambda^2 omega, J_omega -> lambda^3 J_omega, D -> lambda^0 D, Q_s -> lambda^6 Q_s, S_s -> lambda^4 S_s, R_Q -> lambda^2 R_Q."
    incident_id: "INC-002"
    enforcement_test: "tests/test_tp2_g4_adversarial_suite.py::test_parabolic_scaling_exponents"

  - rule_id: "MRR-003"
    name: "RIESZ_GAP_QUALIFICATION"
    statement: "Never claim that a Riesz contour projector is smooth across all degeneracies without explicitly qualifying that the spectral cluster must remain isolated from its complement by a positive spectral gap."
    incident_id: "INC-003"
    enforcement_test: "tests/test_tp2_g4_a2_r1_suite.py::test_spectral_cluster_resolvent_gap"

  - rule_id: "MRR-004"
    name: "NONZERO_GRADIENT_RESIDENCE_EXCLUSION"
    statement: "Every persistence or exit-time proof involving orientation efficiency eta must explicitly verify that the spatial gradient norm h = ||J_omega||_F^2 >= c_h > 0 throughout the claimed consecutive residence interval."
    incident_id: "INC-004"
    enforcement_test: "tests/test_tp2_g4_a3_r1_suite.py::test_corrected_tube_strictly_excludes_zero_gradient"

  - rule_id: "MRR-005"
    name: "PRIMARY_RELATIVE_QV_DENSITY_DOMAINS"
    statement: "Never treat kappa^2 Theta as an algebraically defined product when kappa = 0 and Theta is undefined. Use the primary density Xi := ||D J_omega||^2 / |D omega|^2 on {omega != 0}, which equals 0 when J_omega = 0."
    incident_id: "INC-005"
    enforcement_test: "tests/test_tp2_g4_a3_r1_suite.py::test_theta_domain_and_xi_regular_equivalence"

  - rule_id: "MRR-006"
    name: "FORWARDIZED_CAUCHY_SIGN"
    statement: "Under tau=T-s and the accepted G3 Brownian convention, dZ_tau=+sqrt(2nu) D G dB_tau and dR_tau=2nu N_tau d tau plus its explicit martingale coefficient."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a1_suite.py::test_forwardized_sign_and_g3_martingale"

  - rule_id: "MRR-007"
    name: "DJOMEGA_MATRIX_ORDER"
    statement: "The exact Y=D J_omega drift is B_Y=D(Omega G+G A-T^S)=D(G A-K^A); reject AG swaps, transposes, and D(K-AG)."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a1_suite.py::test_matrix_ordering_and_equivalent_full_gradient_form"

  - rule_id: "MRR-008"
    name: "NUMERATOR_DENOMINATOR_COVARIATION"
    statement: "The Xi quotient must retain d[N,R]=(sigma_N dot sigma_R)d tau and the denominator Ito correction N|sigma_R|^2/R^3."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a1_suite.py::test_nr_covariation_is_present_and_nonzero"

  - rule_id: "MRR-009"
    name: "XI_STOPPING_AND_LOG_DOMAIN"
    statement: "Xi=N/R is asserted only before tau_R; State B permits Xi=0 but not log Xi, and State C has undefined Xi."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a1_suite.py::test_zero_states_and_stopping"

  - rule_id: "MRR-010"
    name: "XI_PARABOLIC_SCALING"
    statement: "The exact Xi quotient drift scales as lambda^4 and its standard-Brownian martingale coefficient as lambda^3 under Navier-Stokes parabolic scaling."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a1_suite.py::test_scaling_weights_are_documented"

  - rule_id: "MRR-011"
    name: "XI_EXPECTATION_NONCLOSURE"
    statement: "Do not replace E[b_Xi] by a function of E[Xi] without a separately proved closure; coefficients retain D, velocity-gradient, source, and spatial-gradient fields."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a1_suite.py::test_expectation_is_not_claimed_closed"

  - rule_id: "MRR-012"
    name: "XI_SQUARE_COMPLETION"
    statement: "The three stochastic quotient terms must equal (2nu/R) sum_l ||H_l-(2c_l/R)Y||_F^2; coefficient 2, Frobenius norm, column Ye_l, and every R power are mandatory."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a2_suite.py::test_square_completion_componentwise"

  - rule_id: "MRR-013"
    name: "XI_RICCATI_ORIGIN"
    statement: "The exact -2nu Xi^2 term originates from -N b_R/R^2, not from numerator dissipation; no global decay is inferred."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a2_suite.py::test_riccati_term_origin_is_denominator"

  - rule_id: "MRR-014"
    name: "XI_ANTISYMMETRIC_GEOMETRY"
    statement: "Omega contributions cannot be dropped for non-orthogonal D; D_ROT vanishes at D=I but may be nonzero for M=D^T D not commuting with Omega."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a2_suite.py::test_nonorthogonal_deformation_can_make_rotation_term_nonzero"

  - rule_id: "MRR-015"
    name: "XI_PRESSURE_ENTRY_BOUNDARY"
    statement: "No direct pressure-Hessian term may be inserted into the A2 drift; pressure dependence at this level is indirect through future evolution of A and S."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a2_suite.py::test_pressure_classification_is_indirect_only"

  - rule_id: "MRR-016"
    name: "XI_WEIGHTED_MEASURE_EVOLUTION"
    statement: "The derivative of E_mu[Xi] must include the evolving weight and sigma_R dot sigma_Xi cross term; it is not E_mu[b_Xi] alone."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a2_suite.py::test_weighted_measure_requires_weight_evolution"

  - rule_id: "MRR-017"
    name: "XI_COMPENSATION_NOT_COERCIVITY"
    statement: "Nonnegative I_Xi and negative -2nu Xi^2 do not establish Xi damping, coercivity, boundedness, or global regularity while D_Xi is sign-indefinite."
    incident_id: "NONE"
    enforcement_test: "tests/test_tp2_g5_a2_verifier_suite.py::test_geometry_sign_is_not_promoted"
