# KNOWN_RESULTS_LEDGER.yaml — External Literature Theorems & Baselines
# Complete catalog of audited mathematical fluid dynamics literature baselines.

known_results:
  - result_id: "LIT-001"
    citation: "Leray, J. (1934). Sur le mouvement d'un liquide visqueux emplissant l'espace. Acta Mathematica, 63, 193-248."
    name: "LERAY_GLOBAL_WEAK_SOLUTIONS"
    result_type: "EXISTENCE_THEOREM"
    assumptions: "u_0 in L^2(R^3) or L^2(T^3), div(u_0) = 0."
    conclusion: "Exists global turbulent weak solution satisfying the energy inequality (1/2)||u(t)||_{L^2}^2 + nu int_0^t ||nabla u||_{L^2}^2 <= (1/2)||u_0||_{L^2}^2."
    domain: "R^3 and T^3"
    limitations: "Uniqueness and smoothness unproved in 3D; energy equality unproved."
    primary_source: "Acta Math. 63, 193-248 (1934)"
    relationship_to_target: "Foundation of weak solution theory; insufficient for Millennium smooth existence."

  - result_id: "LIT-002"
    citation: "Caffarelli, L., Kohn, R., & Nirenberg, L. (1982). Partial regularity of suitable weak solutions of the Navier-Stokes equations. Comm. Pure Appl. Math., 35(6), 771-831."
    name: "CKN_PARTIAL_REGULARITY"
    result_type: "PARTIAL_REGULARITY_THEOREM"
    assumptions: "Suitable weak solution on open space-time domain."
    conclusion: "1-dimensional Hausdorff measure of the singular set S is zero (H^1(S) = 0)."
    domain: "R^3 x (0, T)"
    limitations: "Does not exclude isolated point singularities in space-time."
    primary_source: "CPAM 35(6), 771-831 (1982)"
    relationship_to_target: "Definitive space-time singularity measure bound."

  - result_id: "LIT-003"
    citation: "Beale, J. T., Kato, T., & Majda, A. (1984). Remarks on the breakdown of smooth solutions for the 3-D Euler equations. Commun. Math. Phys., 94(1), 61-66."
    name: "BEALE_KATO_MAJDA_CRITERION"
    result_type: "CONDITIONAL_BLOWUP_CRITERION"
    assumptions: "Smooth solution u on [0, T*)."
    conclusion: "T* is a singularity time iff int_0^{T*} ||omega(t)||_{L^infty} dt = infty (extends directly to viscous NS via Kato 1984)."
    domain: "R^3 and T^3"
    limitations: "Requires L^infty control of vorticity; circular if assumed as an a-priori hypothesis."
    primary_source: "CMP 94(1), 61-66 (1984)"
    relationship_to_target: "Governing regularity blowup criterion."

  - result_id: "LIT-004"
    citation: "Constantin, P., & Fefferman, C. (1993). Direction of vorticity and the problem of global regularity for the Navier-Stokes equations. Indiana Univ. Math. J., 42(3), 775-789."
    name: "CONSTANTIN_FEFFERMAN_VORTICITY_DIRECTION_CRITERION"
    result_type: "GEOMETRIC_REGULARITY_CRITERION"
    assumptions: "Smooth solution with vorticity direction xi = omega / |omega| satisfying Lipschitz coherence |sin phi(x, y, t)| <= c |x - y| in regions of high vorticity."
    conclusion: "No finite-time blowup occurs if vorticity direction coherence is maintained."
    domain: "R^3 and T^3"
    limitations: "Geometric condition on direction field xi is not known to hold a-priori."
    primary_source: "Indiana Univ. Math. J. 42(3), 775-789 (1993)"
    relationship_to_target: "Early precursor to geometric/orientation control in Navier-Stokes."

  - result_id: "LIT-005"
    citation: "Necas, J., Ruzicka, M., & Sverak, V. (1996). On Leray's self-similar solutions of the Navier-Stokes equations. Acta Math., 176(2), 283-294."
    name: "NECAS_RUZICKA_SVERAK_NO_SELF_SIMILAR_BLOWUP"
    result_type: "NO_GO_THEOREM"
    assumptions: "Self-similar ansatz u(x, t) = (2nu(T-t))^{-1/2} U(x / (2nu(T-t))^{1/2}) with U in L^3(R^3)."
    conclusion: "Every self-similar Leray profile U in L^3 is identically zero, ruling out backward self-similar blowup in L^3."
    domain: "R^3"
    limitations: "Applies exclusively to exact self-similar profiles; does not rule out discretely self-similar or chaotic blowup."
    primary_source: "Acta Math. 176(2), 283-294 (1996)"
    relationship_to_target: "Eliminated the classical Leray backward self-similar candidate."

  - result_id: "LIT-006"
    citation: "Koch, H., & Tataru, D. (2001). Well-posedness for the Navier-Stokes equations in BMO^-1. Adv. Math., 157(1), 22-35."
    name: "KOCH_TATARU_BMO_MINUS_ONE"
    result_type: "WELL_POSEDNESS_THEOREM"
    assumptions: "Small initial data in BMO^-1(R^3)."
    conclusion: "Global smooth well-posedness for small initial data in scale-invariant space BMO^-1."
    domain: "R^3"
    limitations: "Requires small initial data; large data remains open."
    primary_source: "Adv. Math. 157(1), 22-35 (2001)"
    relationship_to_target: "Largest known scale-invariant function space for small-data global regularity."

  - result_id: "LIT-007"
    citation: "Beirao da Veiga, H., & Berselli, L. C. (2002). On the regularizing effect of the vorticity direction in incompressible fluid flows. Differential Integral Equations, 15(3), 345-356."
    name: "BEIRAO_DA_VEIGA_BERSELLI_DIRECTION_CRITERION"
    result_type: "GEOMETRIC_REGULARITY_CRITERION"
    assumptions: "Vorticity direction xi in L^p_t L^q_x with 2/p + 3/q <= 1/2."
    conclusion: "Guarantees global smoothness."
    domain: "R^3 and T^3"
    limitations: "Requires integrability of directional gradients."
    primary_source: "Diff. Int. Eq. 15(3), 345-356 (2002)"
    relationship_to_target: "Weakened the Constantin-Fefferman directional regularity threshold."

  - result_id: "LIT-008"
    citation: "Escauriaza, L., Seregin, G., & Sverak, V. (2003). L^{3, infty}-solutions to the Navier-Stokes equations and backward uniqueness. Uspekhi Mat. Nauk, 58(2), 3-44."
    name: "ESCAURIAZA_SEREGIN_SVERAK_L3_CRITERION"
    result_type: "CRITICAL_REGULARITY_THEOREM"
    assumptions: "Solution u in L^infty_t L^3_x(R^3 x [0, T*))."
    conclusion: "No singularity can occur at T* if ||u(t)||_{L^3} remains bounded (resolving Ladyzhenskaya-Prodi-Serrin endpoint)."
    domain: "R^3"
    limitations: "Endpoint L^3 bound is not known to hold globally for large data."
    primary_source: "Uspekhi Mat. Nauk 58(2), 3-44 (2003)"
    relationship_to_target: "Definitive endpoint criterion for L^3 criticality."

  - result_id: "LIT-009"
    citation: "Grujic, Z. (2001). Spatial analyticity on the sub-Kolmogorov scale for the Navier-Stokes equations. Nonlinearity, 14(5), 1017-1025."
    name: "GRUJIC_SUB_KOLMOGOROV_ANALYTICITY"
    result_type: "SPATIAL_ANALYTICITY_THEOREM"
    assumptions: "Smooth solution on T^3 with viscosity nu > 0."
    conclusion: "Spatial analyticity radius delta(t) is bounded from below by the sub-Kolmogorov dissipative scale."
    domain: "T^3"
    limitations: "Analyticity radius vanishes if velocity gradient diverges."
    primary_source: "Nonlinearity 14(5), 1017-1025 (2001)"
    relationship_to_target: "Connects viscous dissipation scales to complex spatial regularity."

  - result_id: "LIT-010"
    citation: "Constantin, P., & Iyer, G. (2008). A stochastic Lagrangian approach to the Navier-Stokes equations. Comm. Pure Appl. Math., 61(3), 330-345."
    name: "CONSTANTIN_IYER_STOCHASTIC_CAUCHY_FORMULA"
    result_type: "REPRESENTATION_THEOREM"
    assumptions: "Classical smooth solution on [0, T]."
    conclusion: "u(x, t) = E[P (nabla A_{0, t})^T u_0(A_{0, t})] and omega(x, t) = E[D_{0, t} omega_0(A_{0, t})]."
    domain: "R^3 and T^3"
    limitations: "Requires C^1 smooth velocity field to differentiate stochastic flow maps."
    primary_source: "CPAM 61(3), 330-345 (2008)"
    relationship_to_target: "Primary theoretical framework of the NS-TRAJECTORY-PERSISTENCE program."

  - result_id: "LIT-011"
    citation: "Eyink, G. L., Gupta, A., & Zaki, T. A. (2013). Stochastic Lagrangian path-integral formulation of Navier-Stokes turbulence. J. Fluid Mech., 723, 386-428."
    name: "EYINK_GUPTA_ZAKI_PATH_INTEGRAL_FORMULATION"
    result_type: "PATH_INTEGRAL_THEORY"
    assumptions: "Turbulent flow with stochastic Lagrangian particles."
    conclusion: "Stochastic Cauchy representations preserve mean vorticity while variance grows backward in time."
    domain: "R^3 and T^3"
    limitations: "Focuses on statistical turbulence rather than mathematical blowup exclusion."
    primary_source: "J. Fluid Mech. 723, 386-428 (2013)"
    relationship_to_target: "Physics and turbulent cascade grounding for stochastic Cauchy growth."

  - result_id: "LIT-012"
    citation: "Kato, T. (1966). Perturbation Theory for Linear Operators. Springer-Verlag."
    name: "KATO_RIESZ_RESOLVENT_PERTURBATION_THEOREM"
    result_type: "OPERATOR_THEORY_THEOREM"
    assumptions: "Isolated spectral cluster Lambda_alpha of Gamma enclosed by contour C with positive spectral gap to complement."
    conclusion: "Riesz projector P_alpha = (1/2pi i) oint_C (zI - Gamma)^-1 dz is analytic under smooth perturbation."
    domain: "Complex Banach/Hilbert spaces"
    limitations: "Canonical contour separation requires positive spectral gap."
    primary_source: "Springer-Verlag (1966)"
    relationship_to_target: "Governs differentiability of spectral subspace projectors in deformation frame."

  - result_id: "LIT-013"
    citation: "Ashurst, W. T., Kerstein, A. R., Kerr, R. M., & Gibson, C. H. (1987). Alignment of vorticity and scalar gradient with strain rate in simulated Navier-Stokes turbulence. Phys. Fluids, 30(8), 2343-2353."
    name: "ASHURST_INTERMEDIATE_STRAIN_ALIGNMENT"
    result_type: "EMPIRICAL_DISCOVERY"
    assumptions: "Direct numerical simulation of isotropic 3D turbulence."
    conclusion: "Vorticity preferentially aligns with the intermediate strain eigenvector e_2 (associated with eigenvalue alpha_2 >= 0)."
    domain: "T^3 (DNS)"
    limitations: "Statistical/numerical finding; not an analytical rigorous invariant."
    primary_source: "Phys. Fluids 30(8), 2343-2353 (1987)"
    relationship_to_target: "Physical motivation for intermediate strain subspace Mode II suppression."

  - result_id: "LIT-014"
    citation: "Encinas-Bartos, A., & Haller, G. (2024). Objective Eulerian and Lagrangian strain tensors in unsteady flows. J. Nonlinear Sci., 34, 12."
    name: "ENCINAS_BARTOS_HALLER_CAUCHY_GREEN_ALIGNMENT"
    result_type: "KINEMATIC_TENSOR_THEORY"
    assumptions: "Finite-time Lagrangian deformation in unsteady fluid flows."
    conclusion: "Singular vector alignment of Cauchy-Green tensors governs material line and surface stretching rates."
    domain: "R^3 and Riemannian manifolds"
    limitations: "Kinematic description; does not incorporate Navier-Stokes viscous dissipation."
    primary_source: "J. Nonlinear Sci. 34, 12 (2024)"
    relationship_to_target: "Mathematical formulation of finite-time SVD singular frame decomposition."

  - result_id: "LIT-015"
    citation: "Eyink, G. L., Gupta, A., & Zaki, T. A. (2020). Stochastic Lagrangian Dynamics of Vorticity I/II, J. Fluid Mech.; arXiv:1912.06677 and arXiv:1912.06684."
    name: "EYINK_GUPTA_ZAKI_STOCHASTIC_CAUCHY_VARIANCE_CANCELLATION"
    result_type: "STOCHASTIC_LAGRANGIAN_THEORY_AND_DNS_APPLICATION"
    assumptions: "Smooth incompressible flow representation; wall-bounded application uses interior/wall formulations and DNS evaluation."
    conclusion: "Mean stochastic Cauchy invariants are conserved backward in time while pathwise variance can grow and opposite-sign contributions can cancel."
    domain: "Interior/wall-bounded flows; periodic/whole-space transport foundation separately."
    limitations: "Does not prove a universal Xi bound, cancellation bound, or regularity closure."
    primary_source: "arXiv:1912.06677; arXiv:1912.06684; JFM version."
    relationship_to_target: "Known stochastic Cauchy foundation and closest variance/cancellation analogue; not Xi."

  - result_id: "LIT-016"
    citation: "Gibbon, J. D. (2012). A hierarchy of length scales for weak solutions of the three-dimensional Navier–Stokes equations, Comm. Math. Sci. 10(1), DOI:10.4310/CMS.2012.v10.n1.a7."
    name: "GIBBON_VORTICITY_MOMENT_INVERSE_LENGTH_HIERARCHY"
    result_type: "INVERSE_LENGTH_SCALE_ESTIMATE"
    assumptions: "Weak 3D incompressible Navier–Stokes solutions on a periodic box; vorticity moments."
    conclusion: "Time-averaged inverse length scales are defined and estimated; the lowest recovers the inverse Kolmogorov scale and higher moments have larger Reynolds exponents."
    domain: "Periodic box."
    limitations: "Eulerian/time-averaged hierarchy; no deformation-relative or stochastic Cauchy weighting."
    primary_source: "Comm. Math. Sci. 10(1) (2012); arXiv:1012.3604."
    relationship_to_target: "Known analogue for kappa_omega, related but distinct from Xi."

  - result_id: "LIT-017"
    citation: "Huang, H. (2026). Exact Lagrangian Realization and Robust Strain Sensing in Incompressible Flow, arXiv:2607.26895."
    name: "HUANG_PERIODIC_NS_DEFORMATION_ONLY_REALIZABILITY"
    result_type: "EXACT_PERIODIC_DEFORMATION_REALIZABILITY"
    assumptions: "Analytic periodic unforced single-shell Euler/Navier–Stokes families; prescribed label, endpoint, and F_* in SL(3,R)."
    conclusion: "Every F_* in SL(3,R) is realized as a one-particle endpoint deformation gradient in the stated class."
    domain: "Periodic torus; analytic exact-flow class."
    limitations: "The audited theorem does not jointly prescribe arbitrary (D, omega, J_omega) jets; arXiv preprint status."
    primary_source: "arXiv:2607.26895."
    relationship_to_target: "D-only realizability informs, but does not close, the joint-jet question or Xi."

  - result_id: "LIT-018"
    citation: "Mahithitarmmatorn, T. (2026). Exact mean-covariance dynamics of the Weber field in the stochastic Lagrangian representation of the 3D Navier–Stokes equations, arXiv:2608.16915."
    name: "MAHITHITARMMATORN_WEBER_MEAN_COVARIANCE_DYNAMICS"
    result_type: "STOCHASTIC_WEBER_COVARIANCE_THEORY"
    assumptions: "Smooth periodic Navier–Stokes solutions and Constantin–Iyer Weber representation."
    conclusion: "Closed mean/covariance, deformation-variance, and two-point covariance equations are derived, with explicit obstructions and a Serrin-equivalent quotient criterion; no global regularity claim."
    domain: "Periodic torus."
    limitations: "Weber velocity/deformation covariance, not vorticity-gradient Xi; preprint status."
    primary_source: "arXiv:2608.16915."
    relationship_to_target: "Closest current stochastic covariance analogue; collision audit remains negative for exact Xi."

  - result_id: "LIT-019"
    citation: "Lei, Z., Ren, X., & Tian, G. (2025). A geometric characterization of potential Navier–Stokes singularities, arXiv:2501.08976."
    name: "LEI_REN_TIAN_DOUBLE_CONE_SCENARIO_RESTRICTION"
    result_type: "GEOMETRIC_REGULARITY_CRITERION"
    assumptions: "Local suitable weak solution with vorticity directions in a double cone in high-vorticity regions, under the theorem's local hypotheses."
    conclusion: "The stated double-cone condition implies regularity; a potential singularity must evade that high-vorticity-region geometry."
    domain: "Local Navier–Stokes space-time cylinders."
    limitations: "The theorem controls spatial high-vorticity-region geometry, not the project deformation-weighted Xi or its stochastic history measure."
    primary_source: "https://arxiv.org/abs/2501.08976"
    relationship_to_target: "A4 scenario restriction; no direct transfer from rigid stochastic histories to a double-cone hypothesis."

  - result_id: "LIT-020"
    citation: "Grujic, Z. (2026). Logarithmic Depletion of Vortex Stretching and Singularity Evasion in the 3D Navier–Stokes Equations, arXiv:2607.08866."
    name: "GRUJIC_LOGARITHMIC_DEPLETION_PREPRINT"
    result_type: "PREPRINT_GEOMETRIC_ANALYTIC_REGULARITY_MECHANISM"
    assumptions: "The preprint's logarithmically weighted BMO direction hypothesis and stated critical concentration framework."
    conclusion: "The abstract claims a chain from logarithmic directional control to depletion, sparseness/analyticity, and singularity evasion."
    domain: "As stated in the July 2026 arXiv preprint."
    limitations: "PREPRINT; not community-accepted in this project and not an Xi theorem."
    primary_source: "https://arxiv.org/abs/2607.08866"
    relationship_to_target: "A4 scenario restriction only; rigid-branch C_D control does not supply the source hypothesis."
