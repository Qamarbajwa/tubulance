      - assumption_id: "det(D) = 1"
        removable: true
        relaxed_conclusion: "Holds for any real matrix D in R^{3x3} without unit determinant constraint."
    status: "COMPLETED"

  - item_id: "AMQ-002"
    claim_id: "CLM-011"
    target_statement: "Exact rate decomposition d_s ln(chi_s) = 2nu E_mu[Xi]"
    current_assumptions: ["C^1 velocity field", "Non-trivial classical solution S_s > 0"]
