    claim_id: "CLM-004"
    target_statement: "SVD orientation decomposition ||D J_omega||^2 = ||J_omega||^2 sum p_i sigma_i^2"
    current_assumptions: ["D in SL(3, R)", "J_omega in R^{3x3}"]
