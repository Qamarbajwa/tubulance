        zero_tolerance: true
      - id: "INV-A3-06"
        statement: "N2 literature absence is not externally validated novelty."
        zero_tolerance: true
      - id: "INV-A3-07"
        statement: "E_mu[Xi] is not replaced by an Eulerian spatial average without a proved relation."
