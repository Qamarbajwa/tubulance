[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navier3d"
version = "0.1.0.dev0"
description = "A modular, general-purpose 3D incompressible Navier-Stokes solver."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
viz = ["matplotlib>=3.7", "pyvista>=0.42"]
amg = ["pyamg>=5.0"]
perf = ["psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
