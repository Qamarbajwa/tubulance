# Fully filled, synthetic-source manifest for local acceptance testing
# of the run_real_validation.py execution chain -- see
# tests/test_run_real_validation.py. Uses random synthetic velocity
# fields, NOT real JHTDB data (source: synthetic, data_is_real: false).
# The runner refuses to execute this against data_is_real: true.

dataset: synthetic_test

snapshots:
  calibration:
    - time: 0.0
      origin: [0, 0, 0]
      size: [64, 64, 64]
      source: synthetic
    - time: 1.0
      origin: [0, 0, 0]
      size: [64, 64, 64]
      source: synthetic
    - time: 2.0
      origin: [0, 0, 0]
      size: [64, 64, 64]
      source: synthetic

  validation:
    - time: 10.0
      origin: [0, 0, 0]
      size: [64, 64, 64]
      source: synthetic
    - time: 11.0
      origin: [0, 0, 0]
      size: [64, 64, 64]
      source: synthetic
    - time: 12.0
      origin: [0, 0, 0]
      size: [64, 64, 64]
      source: synthetic

resolution_tiers: [64]

terminal_layer:
  preferred_shells: 8
  minimum_shells: 6
  minimum_populated_shells: 4
  cutoff_nyquist_fraction: 0.5

placements:
  local_cancellation: {}
  parent_band_energy_weighted:
    c1: 0.3
    c2: 0.8
  turnover_weighted: {}
  dns_oracle_diagnostic:
    enabled: true

classification:
  data_is_real: false
