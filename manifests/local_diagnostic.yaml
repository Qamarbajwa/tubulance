# Local diagnostic manifest -- pipeline/code-path validation only.
#
# Auto-discovered from the two root-level HDF5 files:
#   isotropic1024coarse.h5           (1 snapshot)
#   isotropic1024coarse (1).h5       (5 snapshots)
#
# IMPORTANT FINDING: isotropic1024coarse.h5's only frame is BIT-IDENTICAL
# to frame 1 of isotropic1024coarse (1).h5 (verified via np.array_equal,
# max abs diff 0.0). It is a duplicate, not an independent snapshot --
# using both files naively would put the same data in both calibration
# and validation. This manifest therefore uses ONLY
# "isotropic1024coarse (1).h5", splitting its 5 frames into 1 calibration
# + 4 validation snapshots (frame_index disjoint). The single-snapshot
# file is not used here at all.
#
# `time` values below are the frame index, NOT a confirmed physical JHTDB
# time coordinate -- see AGENTS.md "Never guess physical constants". Both
# files' t_start/t_end/t_step attrs are query parameters, not documented
# physical time; no confirmed Delta-t exists for this data (dt_confirmed
# is False wherever measure_transfer.TimeCoordinate is actually used).
# The manifest schema currently requires a numeric `time` per snapshot but
# the pipeline this manifest drives (nonlinear_transfer_validation via
# placement_comparison) is Delta-t-free (T(k) is instantaneous), so this
# field is presently unused by the computation -- see the accompanying
# report for why that's a real (not hidden) gap.
#
# resolution_tiers is [16] because that is the only resolution this local
# data actually has. This is expected to fail terminal_layer.minimum_shells
# (N_T=4 < 6 at cutoff_nyquist_fraction=0.5) -- that is the correct,
# honest outcome for 16^3 data, not a bug to work around.

dataset: isotropic1024coarse

snapshots:
  calibration:
    - time: 1
      origin: [100, 100, 100]
      size: [16, 16, 16]
      stride: [1, 1, 1]
      source: local_h5
      path: "isotropic1024coarse (1).h5"
      frame_index: 1

  validation:
    - time: 2
      origin: [100, 100, 100]
      size: [16, 16, 16]
      stride: [1, 1, 1]
      source: local_h5
      path: "isotropic1024coarse (1).h5"
      frame_index: 2

    - time: 3
      origin: [100, 100, 100]
      size: [16, 16, 16]
      stride: [1, 1, 1]
      source: local_h5
      path: "isotropic1024coarse (1).h5"
      frame_index: 3

    - time: 4
      origin: [100, 100, 100]
      size: [16, 16, 16]
      stride: [1, 1, 1]
      source: local_h5
      path: "isotropic1024coarse (1).h5"
      frame_index: 4

    - time: 5
      origin: [100, 100, 100]
      size: [16, 16, 16]
      stride: [1, 1, 1]
      source: local_h5
      path: "isotropic1024coarse (1).h5"
      frame_index: 5

resolution_tiers: [16]

terminal_layer:
  preferred_shells: 8
  minimum_shells: 6
  minimum_populated_shells: 4
  cutoff_nyquist_fraction: 0.5

placements:
  local_cancellation: {}
  parent_band_energy_weighted:
    c1: 0.5
    c2: 0.9
  turnover_weighted: {}
  dns_oracle_diagnostic:
    enabled: true

classification:
  # Real JHTDB velocity data (not synthetic) -- but see report for why the
  # resolution is far below what's needed for a physical claim. data_is_real
  # reflects DATA PROVENANCE; classify_run/dataset_level_classification
  # separately (and independently) determine ADEQUACY.
  data_is_real: true
