# NS-RPM-1: RESEARCH OBSTRUCTION REGISTRY

obstructions:
  - obstruction_id: "NS-OBS-001"
    name: "VISCOUS_LAPLACIAN_INDEFINITE_TRAJECTORY_SIGN"
    description: "The viscous Laplacian term nu Delta omega in the vorticity equation has no universal negative sign along Lagrangian trajectories, permitting local viscous vortex amplification where curvature opposes diffusion."
    first_encountered_in: "TH7"
    affected_pathways: ["TH7", "TH8", "NS-TRAJECTORY-PERSISTENCE-1"]
    mathematical_core: "nu * (omega / |omega|) . Delta omega is indefinite and depends on the sign of spatial curvature."
    known_bypasses_or_relaxations: ["Lagrangian stochastic Weber formulation replacing Laplacian with Brownian expectation."]
    status: "ACTIVE_STRUCTURAL_BARRIER"

  - obstruction_id: "NS-OBS-002"
    name: "STATIC_ALIGNMENT_UNIVERSAL_DEPLETION_FALSIFICATION"
    description: "Universal static bound lambda_omega <= (1 - delta) lambda_3 is false; near-complete alignment (cos theta -> 1) between vorticity and maximum stretching eigenvector is physically and numerically realizable."
    first_encountered_in: "TH8"
    affected_pathways: ["TH8", "TH9", "LA1-R"]
    mathematical_core: "sup (xi . S xi) / lambda_3 = 1.0 in extreme strain events."
    known_bypasses_or_relaxations: ["Dynamic fast eigenframe rotation / twist-antitwist cancellation (TH9-R, TH10-R)."]
    status: "FALSIFIED_STATIC_BOUND"

  - obstruction_id: "NS-OBS-003"
    name: "FINITE_WINDOW_NUMERICAL_PERSISTENCE_GAP"
    description: "Finite-window numerical persistence and empirical refractory damping cannot mathematically exclude Zeno-type burst accumulation or asymptotic blowup."
    first_encountered_in: "TH9-R"
    affected_pathways: ["TH9-R", "TH10-R", "BRIDGE1-R"]
    mathematical_core: "lim inf Delta t_burst = 0 is not excluded by finite-time discretizations."
    known_bypasses_or_relaxations: ["Scale-invariant ancient limit classification / Liouville rigidity (BRIDGE1-R)."]
    status: "EPISTEMIC_LIMITATION"

  - obstruction_id: "NS-OBS-004"
    name: "BKM_SERRIN_CIRCULARITY_BARRIER"
    description: "Any attempt to bound deformation amplification by assuming a-priori L^p_t L^q_x control on velocity or L^1_t L^infinity_x on vorticity circularly presupposes the regularity theorem being sought."
    first_encountered_in: "REP-SYNTHESIS1"
    affected_pathways: ["REP-SYNTHESIS1", "NS-TRAJECTORY-PERSISTENCE-1", "TP2-G3", "TP2-G5-A1", "TP2-G5-A2"]
    mathematical_core: "int_0^T ||omega||_{L^infinity} dt < infty cannot appear on the right-hand side of a regularizing bound."
    known_bypasses_or_relaxations: ["Scale-critical invariant observables (chi) and exact quadratic variation balances."]
    status: "METHODOLOGICAL_RULE"

  - obstruction_id: "NS-OBS-005"
    name: "QUALITATIVE_POSITIVITY_NOT_QUANTITATIVE_LOWER_BOUND"
    description: "Proving that quadratic variation or variance production is strictly positive (Q_s > 0) does not provide a scale-critical quantitative lower bound Q_s >= F(deformation) capable of outgrowing explosive stretching."
    first_encountered_in: "TP2-G3"
    affected_pathways: ["TP2-G3", "TP2-G4", "TP2-G5-A1", "TP2-G5-A2"]
    mathematical_core: "Q_s = 2*nu*E[||D J_omega||_F^2] > 0 does not imply inf_{s < T} Q_s >= c * ||omega(T)||^2."
    known_bypasses_or_relaxations: ["Unresolved; central objective assigned to TP2-G4."]
    status: "ACTIVE_RESEARCH_FRONTIER"

  - obstruction_id: "NS-OBS-006"
    name: "ROUGH_FLOW_DIFFERENTIABILITY_LOSS"
    description: "Generic Leray-Hopf weak solutions do not possess C^1 flow maps; deformation matrices D_s and Jacobians J_omega cannot be evaluated pathwise without higher regularity."
    first_encountered_in: "REP-LAGRANGIAN1"
    affected_pathways: ["REP-LAGRANGIAN1", "TP2-G1", "TP2-G3", "TP2-G5-A1", "TP2-G5-A2"]
    mathematical_core: "Flow map X_{s,t} is not a diffeomorphism if u not in L^1_t C^1_x."
    known_bypasses_or_relaxations: ["Restricting analysis to classical solutions on [0, T*) approaching candidate singular time."]
    status: "ANALYTICAL_DOMAIN_BOUNDARY"

  - obstruction_id: "NS-OBS-007"
    name: "NONLOCAL_PRESSURE_HESSIAN_COUPLING"
    description: "Pointwise vorticity-strain alignment is continuously perturbed by the non-local pressure Hessian Pi = nabla^2 p, preventing static decoupled closures."
    first_encountered_in: "TH9-R"
    affected_pathways: ["TH9-R", "REP-PRESSURE-MULTISCALE1"]
    mathematical_core: "D_t S = -S^2 - Omega^2 - Pi + nu Delta S; Pi is non-local and couples all scales."
    known_bypasses_or_relaxations: ["Multiscale pressure decomposition into local parabolic and non-local harmonic fluxes."]
    status: "PHYSICAL_COUPLING_BARRIER"

  - obstruction_id: "NS-OBS-008"
    name: "PHYSICAL_WALL_BOUNDARY_LOCAL_TIME_VORTICITY_FLUX"
    description: "In domains with physical boundaries (no-slip walls), stochastic Cauchy representations acquire boundary local-time integrals of vorticity flux that break torus/whole-space formulas."
    first_encountered_in: "TP2-G1"
    affected_pathways: ["TP2-G1", "TP2-G3"]
    mathematical_core: "omega(x, T) = E[Z_0] + int_0^T E[nabla n . sigma(X_s)] dL_s(boundary)."
    known_bypasses_or_relaxations: ["Restricting analysis strictly to periodic 3-torus T^3 or decaying R^3."]
    status: "GEOMETRIC_DOMAIN_BOUNDARY"

  - obstruction_id: "NS-OBS-009"
    name: "DEFORMATION_ONLY_Q_BOUND_SCALING_MISMATCH"
    description: "Stochastic Cauchy quadratic variation Q_s scales as lambda^6 under NS parabolic rescaling, while deformation norm ||D_s||_F^2 is dimensionless (lambda^0). Unscaled lower bounds Q >= F(||D||) are dimensionally impossible."
    severity: "FATAL_TO_DIRECT_BOUND"
    first_discovered_in: "TP2-G4"
    status: "CONFIRMED_ACTIVE"
    affected_pathways:
      - "TP2-G4"
    mathematical_core: "Q_s -> lambda^6 Q_s, ||D||^2 -> lambda^0 ||D||^2; unscaled scalar lower bounds are dimensionally inhomogeneous."
    known_bypasses_or_relaxations: ["Reformulate comparison via scaling-compatible rate R_Q(s) = Q_s / S_s = d_s ln(chi_s) (scales as lambda^2)."]

  - obstruction_id: "NS-OBS-010"
    name: "LOW_ETA_PERSISTENCE_NOT_UNIVERSALLY_EXCLUDED_BY_NAVIER_STOKES"
    description: "Exact periodic shear flows on T^3 prove that Navier-Stokes dynamics permit arbitrarily long occupation times O_eps -> L and residence durations in low-eta states (eta ~ sigma_1^-2 -> 0) without singularity formation. Rules out universal data-independent persistence bounds."
    severity: "FATAL_TO_UNIVERSAL_PERSISTENCE_BOUND"
    first_discovered_in: "TP2-G4-A3"
    status: "CONFIRMED_ACTIVE"
    affected_pathways:
      - "TP2-G4"
      - "TH9-R"

  - obstruction_id: "NS-OBS-011"
    name: "DIRECT_XI_EVOLUTION_REGULARITY_CIRCULARITY"
    description: "Direct pathwise differential control of Xi through strain histories requires regularity-equivalent BKM/Serrin-type control; this blocks the direct route but does not rule out non-circular integrated, pressure, geometric, or stochastic-cancellation mechanisms."
    severity: "OPEN_STRUCTURAL_OBSTRUCTION"
    first_discovered_in: "TP2-G4-A5-R1"
    status: "OPEN_STRUCTURAL_OBSTRUCTION"
    affected_pathways: ["TP2-G4", "TP2-G5", "TP2-G5-A1", "TP2-G5-A2", "REP-SYNTHESIS1"]
    mathematical_core: "A pathwise lower or upper control of Xi obtained from integral ||S||_infinity or equivalent continuation norms is circular for the Clay target."
    known_bypasses_or_relaxations: ["Nonlocal pressure-Hessian constraints", "Biot-Savart and commutator cancellation", "Geometric sparseness/analyticity", "Weighted or integrated stochastic cancellation"]

  - obstruction_id: "NS-OBS-012"
    name: "DEFORMATION_METRIC_DERIVATIVE_ORDER_ESCALATION"
    description: "The exact Xi split is pointwise, but evolution of its terms differentiates D, xi, and higher spatial derivatives; A2 drift data do not provide a scalar Xi closure."
    first_encountered_in: "TP2-G5-A3"
    affected_pathways: ["TP2-G5", "TP2-G5-A2", "TP2-G5-A3"]
    mathematical_core: "D_Xi contains higher-order deformation and vorticity-gradient information not determined by Xi, M_D, or C_D alone."
    known_bypasses_or_relaxations: ["Full-coefficient integrated identities; pressure or geometric flux with separately proved bounds"]
    status: "OPEN_STRUCTURAL_OBSTRUCTION"

  - obstruction_id: "NS-OBS-013"
    name: "GEOMETRIC_CRITERIA_NO_DIRECT_XI_TRANSFER"
    description: "Direction coherence, sparseness, and analyticity criteria have hypotheses and geometric objects that do not automatically control deformation-weighted Xi."
    first_encountered_in: "TP2-G5-A3"
    affected_pathways: ["TH9-R", "TP2-G5-A3", "REP-SYNTHESIS1"]
    mathematical_core: "A matched bridge must control the deformation metric, derivative order, domain, and measure; analogy is not implication."
    known_bypasses_or_relaxations: ["A new theorem with explicit deformation and measure hypotheses"]
    status: "ACTIVE_BRIDGE_OBSTRUCTION"

  - obstruction_id: "NS-OBS-014"
    name: "MU_WEIGHTING_EULERIAN_NONIDENTIFICATION"
    description: "The Lagrangian Cauchy-energy weighted measure mu is not the Eulerian spatial measure by definition, so E_mu[Xi] cannot be replaced by an Eulerian average without a measure-identification result."
    first_encountered_in: "TP2-G5-A3"
    affected_pathways: ["TP2-G5-A1", "TP2-G5-A2", "TP2-G5-A3"]
    mathematical_core: "The density rho and its evolution remain part of E_mu; changing measure introduces a separate Jacobian/support/integrability obligation."
    known_bypasses_or_relaxations: ["A proved change-of-measure theorem for the stopped stochastic flow"]
    status: "OPEN_MEASURE_OBSTRUCTION"

  - obstruction_id: "NS-OBS-015"
    name: "STOCHASTIC_HISTORY_TO_SPATIAL_GEOMETRY_GAP"
    description: "Integrated mu-weighted control of M_D or C_D along terminal-point histories does not by itself give pointwise or high-vorticity-region spatial direction control."
    first_encountered_in: "TP2-G5-A4"
    affected_pathways: ["TP2-G5-A4", "TP2-G5-A3", "TH9-R"]
    mathematical_core: "The normalized history measure contains 1/L_n and no proved identification with Eulerian spatial measure or high-vorticity-region coverage."
    known_bypasses_or_relaxations: ["A separate uniform history-to-space estimate with non-circular covering and measure hypotheses."]
    status: "OPEN_STRUCTURAL_OBSTRUCTION"

  - obstruction_id: "NS-OBS-016"
    name: "COVARIANCE_TRACE_SPECTRAL_UNDERDETERMINATION"
    description: "A lower bound on relative covariance trace in the decoherent branch does not determine isotropy, rank, eigenvalue gaps, or directional dispersion."
    first_encountered_in: "TP2-G5-A4"
    affected_pathways: ["TP2-G5-A4", "TP2-G5-A2", "TP2-G3"]
    mathematical_core: "tr(C_s)/|m_n|^2=e^{J_n}-1 constrains only a scalar trace, not the covariance spectrum."
    known_bypasses_or_relaxations: ["Independent covariance-eigenstructure estimates or directional moment identities."]
    status: "OPEN_INFORMATIONAL_OBSTRUCTION"

  - obstruction_id: "NS-OBS-017"
    name: "PRESSURE_HESSIAN_PHASE_CANCELLATION_AND_MEASURE_GAP"
    description: "Non-local Calderon-Zygmund singular integrals allow local phase cancellation between strain and the pressure Hessian without uniform pointwise coercivity, and Eulerian L^p(dx) bounds decouple from Lagrangian E_mu_s[Xi_s]."
    first_encountered_in: "TP2-G6-A1"
    affected_pathways: ["TP2-G6-A1", "TP2-G6-B1", "TP2-G6-B2"]
    mathematical_core: "e_1 . Pi^dev e_1 does not satisfy pointwise lower bounds against alpha_1^2 due to non-local phase cancellation in singular integrals, and bounding dmu_s/dx <= C requires BKM circularity."
    known_bypasses_or_relaxations: ["Geometric vortex alignment criteria or non-circular covering measure estimates resolving Bridge B2."]
    status: "OPEN_STRUCTURAL_OBSTRUCTION"

  - obstruction_id: "NS-OBS-018"
    name: "SINGLE_PARTICLE_STOCHASTIC_HISTORY_MEASURE_DECOUPLING_AND_DEFICIT"
    description: "Single-particle stochastic Lagrangian trajectories fail to provide Eulerian high-vorticity spatial coverage under subcritical energy bounds due to convective sweeping of particles away from localized cores and dynamic decoupling between deformation weights |Z_s|^2 and Eulerian vorticity |omega|^2."
    first_encountered_in: "TP2-G6-A2"
    affected_pathways: ["TP2-G6-A2", "TP2-G6-B2", "TP2-G6-B1"]
    mathematical_core: "Energy drift u in L^2_t L^6_x has Serrin index 1.5 > 1 (supercritical deficit 0.5), invalidating Aronson Gaussian lower bounds (BM-A2-04), while deformation tensor D_s aligns with compression axes to extinguish |Z_s|^2 in high-vorticity cores and amplifies in hyperbolic saddles (BM-A2-05), yielding inf_{u in U_{E_0}} mu_s(A_s^{-1}(E_s)) = 0 and unbounded Eulerian density rho_s in L^p (p > 1)."
    known_bypasses_or_relaxations: ["Relative two-particle dispersion delta A_s = A_s(x+h) - A_s(x) or stochastic jet transport (nabla A_s, nabla^2 A_s) under Programme TP2-G6-C to eliminate background drift translation."]
    status: "PROVED_STRUCTURAL_OBSTRUCTION"

  - obstruction_id: "NS-OBS-019"
    name: "TWO_PARTICLE_BROWNIAN_COUPLING_DUALITY_AND_STRAIN_DECOUPLING"
    description: "The two-particle stochastic framework is partitioned by a mutual exclusivity dilemma: synchronous noise (C-SYNC) preserves flow differentiability and generates the exact stochastic jet limit but provides zero relative diffusion (nu_rel = 0); independent noise (C-IND) provides relative diffusion (12nu) but destroys spatial differentiability (delta A / |h| -> infty), while local hyperbolic strain continues to decouple deformation weights from vorticity in both couplings."
    first_encountered_in: "TP2-G6-C1"
    affected_pathways: ["TP2-G6-C1", "TP2-G6-B2", "TP2-G6-B3"]
    mathematical_core: "Under C-SYNC, noise cancels pathwise, preventing autonomous spatial spreading and leaving pair covariance strictly rank 1 in planar shear; under C-IND, noise non-differentiability diverges the jet quotient as |h|^-1; under both couplings, internal strain rate ~ M_n expels particles from candidate cores and deformation alignment extinguishes difference weights."
    known_bypasses_or_relaxations: ["Scale-dependent Brownian correlation tensors rho(h) with transition from synchronous to independent noise at the viscous dissipation scale r_n (TP2-G6-C2)."]
    status: "PROVED_STRUCTURAL_OBSTRUCTION"


