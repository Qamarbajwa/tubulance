# NS-RPM-1: RESEARCH OBSTRUCTION REGISTRY

obstructions:
  - obstruction_id: "NS-OBS-001"
    name: "VISCOUS_LAPLACIAN_INDEFINITE_TRAJECTORY_SIGN"
    description: "The viscous Laplacian term nu Delta omega in the vorticity equation has no universal negative sign along Lagrangian trajectories, permitting local viscous vortex amplification where curvature opposes diffusion."
    first_encountered_in: "TH7"
    affected_pathways: ["TH7", "TH8", "NS-TRAJECTORY-PERSISTENCE-1"]
    mathematical_core: "nu * (omega / |omega|) . Delta omega is indefinite and depends on the sign of spatial curvature."
    known_bypasses_or_relaxations: ["Lagrangian stochastic Weber formulation replacing Laplacian with Brownian expectation."]
    status: "ACTIVE_STRUCTURAL_BARRIER"

  - obstruction_id: "NS-OBS-002"
    name: "STATIC_ALIGNMENT_UNIVERSAL_DEPLETION_FALSIFICATION"
    description: "Universal static bound lambda_omega <= (1 - delta) lambda_3 is false; near-complete alignment (cos theta -> 1) between vorticity and maximum stretching eigenvector is physically and numerically realizable."
    first_encountered_in: "TH8"
    affected_pathways: ["TH8", "TH9", "LA1-R"]
    mathematical_core: "sup (xi . S xi) / lambda_3 = 1.0 in extreme strain events."
    known_bypasses_or_relaxations: ["Dynamic fast eigenframe rotation / twist-antitwist cancellation (TH9-R, TH10-R)."]
    status: "FALSIFIED_STATIC_BOUND"

  - obstruction_id: "NS-OBS-003"
    name: "FINITE_WINDOW_NUMERICAL_PERSISTENCE_GAP"
    description: "Finite-window numerical persistence and empirical refractory damping cannot mathematically exclude Zeno-type burst accumulation or asymptotic blowup."
    first_encountered_in: "TH9-R"
    affected_pathways: ["TH9-R", "TH10-R", "BRIDGE1-R"]
    mathematical_core: "lim inf Delta t_burst = 0 is not excluded by finite-time discretizations."
    known_bypasses_or_relaxations: ["Scale-invariant ancient limit classification / Liouville rigidity (BRIDGE1-R)."]
    status: "EPISTEMIC_LIMITATION"

  - obstruction_id: "NS-OBS-004"
    name: "BKM_SERRIN_CIRCULARITY_BARRIER"
    description: "Any attempt to bound deformation amplification by assuming a-priori L^p_t L^q_x control on velocity or L^1_t L^infinity_x on vorticity circularly presupposes the regularity theorem being sought."
    first_encountered_in: "REP-SYNTHESIS1"
    affected_pathways: ["REP-SYNTHESIS1", "NS-TRAJECTORY-PERSISTENCE-1", "TP2-G3", "TP2-G5-A1"]
    mathematical_core: "int_0^T ||omega||_{L^infinity} dt < infty cannot appear on the right-hand side of a regularizing bound."
    known_bypasses_or_relaxations: ["Scale-critical invariant observables (chi) and exact quadratic variation balances."]
    status: "METHODOLOGICAL_RULE"

  - obstruction_id: "NS-OBS-005"
    name: "QUALITATIVE_POSITIVITY_NOT_QUANTITATIVE_LOWER_BOUND"
    description: "Proving that quadratic variation or variance production is strictly positive (Q_s > 0) does not provide a scale-critical quantitative lower bound Q_s >= F(deformation) capable of outgrowing explosive stretching."
    first_encountered_in: "TP2-G3"
    affected_pathways: ["TP2-G3", "TP2-G4", "TP2-G5-A1"]
    mathematical_core: "Q_s = 2*nu*E[||D J_omega||_F^2] > 0 does not imply inf_{s < T} Q_s >= c * ||omega(T)||^2."
    known_bypasses_or_relaxations: ["Unresolved; central objective assigned to TP2-G4."]
    status: "ACTIVE_RESEARCH_FRONTIER"

  - obstruction_id: "NS-OBS-006"
    name: "ROUGH_FLOW_DIFFERENTIABILITY_LOSS"
    description: "Generic Leray-Hopf weak solutions do not possess C^1 flow maps; deformation matrices D_s and Jacobians J_omega cannot be evaluated pathwise without higher regularity."
    first_encountered_in: "REP-LAGRANGIAN1"
    affected_pathways: ["REP-LAGRANGIAN1", "TP2-G1", "TP2-G3", "TP2-G5-A1"]
    mathematical_core: "Flow map X_{s,t} is not a diffeomorphism if u not in L^1_t C^1_x."
    known_bypasses_or_relaxations: ["Restricting analysis to classical solutions on [0, T*) approaching candidate singular time."]
    status: "ANALYTICAL_DOMAIN_BOUNDARY"

  - obstruction_id: "NS-OBS-007"
    name: "NONLOCAL_PRESSURE_HESSIAN_COUPLING"
    description: "Pointwise vorticity-strain alignment is continuously perturbed by the non-local pressure Hessian Pi = nabla^2 p, preventing static decoupled closures."
    first_encountered_in: "TH9-R"
    affected_pathways: ["TH9-R", "REP-PRESSURE-MULTISCALE1"]
    mathematical_core: "D_t S = -S^2 - Omega^2 - Pi + nu Delta S; Pi is non-local and couples all scales."
    known_bypasses_or_relaxations: ["Multiscale pressure decomposition into local parabolic and non-local harmonic fluxes."]
    status: "PHYSICAL_COUPLING_BARRIER"

  - obstruction_id: "NS-OBS-008"
    name: "PHYSICAL_WALL_BOUNDARY_LOCAL_TIME_VORTICITY_FLUX"
    description: "In domains with physical boundaries (no-slip walls), stochastic Cauchy representations acquire boundary local-time integrals of vorticity flux that break torus/whole-space formulas."
    first_encountered_in: "TP2-G1"
    affected_pathways: ["TP2-G1", "TP2-G3"]
    mathematical_core: "omega(x, T) = E[Z_0] + int_0^T E[nabla n . sigma(X_s)] dL_s(boundary)."
    known_bypasses_or_relaxations: ["Restricting analysis strictly to periodic 3-torus T^3 or decaying R^3."]
    status: "GEOMETRIC_DOMAIN_BOUNDARY"

  - obstruction_id: "NS-OBS-009"
    name: "DEFORMATION_ONLY_Q_BOUND_SCALING_MISMATCH"
    description: "Stochastic Cauchy quadratic variation Q_s scales as lambda^6 under NS parabolic rescaling, while deformation norm ||D_s||_F^2 is dimensionless (lambda^0). Unscaled lower bounds Q >= F(||D||) are dimensionally impossible."
    severity: "FATAL_TO_DIRECT_BOUND"
    first_discovered_in: "TP2-G4"
    status: "CONFIRMED_ACTIVE"
    affected_pathways:
      - "TP2-G4"
    mathematical_core: "Q_s -> lambda^6 Q_s, ||D||^2 -> lambda^0 ||D||^2; unscaled scalar lower bounds are dimensionally inhomogeneous."
    known_bypasses_or_relaxations: ["Reformulate comparison via scaling-compatible rate R_Q(s) = Q_s / S_s = d_s ln(chi_s) (scales as lambda^2)."]

  - obstruction_id: "NS-OBS-010"
    name: "LOW_ETA_PERSISTENCE_NOT_UNIVERSALLY_EXCLUDED_BY_NAVIER_STOKES"
    description: "Exact periodic shear flows on T^3 prove that Navier-Stokes dynamics permit arbitrarily long occupation times O_eps -> L and residence durations in low-eta states (eta ~ sigma_1^-2 -> 0) without singularity formation. Rules out universal data-independent persistence bounds."
    severity: "FATAL_TO_UNIVERSAL_PERSISTENCE_BOUND"
    first_discovered_in: "TP2-G4-A3"
    status: "CONFIRMED_ACTIVE"
    affected_pathways:
      - "TP2-G4"
      - "TH9-R"

  - obstruction_id: "NS-OBS-011"
    name: "DIRECT_XI_EVOLUTION_REGULARITY_CIRCULARITY"
    description: "Direct pathwise differential control of Xi through strain histories requires regularity-equivalent BKM/Serrin-type control; this blocks the direct route but does not rule out non-circular integrated, pressure, geometric, or stochastic-cancellation mechanisms."
    severity: "OPEN_STRUCTURAL_OBSTRUCTION"
    first_discovered_in: "TP2-G4-A5-R1"
    status: "OPEN_STRUCTURAL_OBSTRUCTION"
    affected_pathways: ["TP2-G4", "TP2-G5", "TP2-G5-A1", "REP-SYNTHESIS1"]
    mathematical_core: "A pathwise lower or upper control of Xi obtained from integral ||S||_infinity or equivalent continuation norms is circular for the Clay target."
    known_bypasses_or_relaxations: ["Nonlocal pressure-Hessian constraints", "Biot-Savart and commutator cancellation", "Geometric sparseness/analyticity", "Weighted or integrated stochastic cancellation"]
